<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculadora - Vitor</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="calculadora">

        <h1>Calculadora</h1>

        <input
            type="text"
            id="display"
            value="0"
            disabled
        >

        <div class="botoes">

            <button class="limpar"
                    onclick="limpar()">
                C
            </button>

            <button onclick="adicionar('/')">
                ÷
            </button>

            <button onclick="adicionar('*')">
                ×
            </button>

            <button onclick="adicionar('-')">
                −
            </button>


            <button onclick="adicionar('7')">
                7
            </button>

            <button onclick="adicionar('8')">
                8
            </button>

            <button onclick="adicionar('9')">
                9
            </button>

            <button onclick="adicionar('+')">
                +
            </button>


            <button onclick="adicionar('4')">
                4
            </button>

            <button onclick="adicionar('5')">
                5
            </button>

            <button onclick="adicionar('6')">
                6
            </button>

            <button class="igual"
                    onclick="calcular()">
                =
            </button>


            <button onclick="adicionar('1')">
                1
            </button>

            <button onclick="adicionar('2')">
                2
            </button>

            <button onclick="adicionar('3')">
                3
            </button>

            <button onclick="adicionar('0')">
                0
            </button>


            <button onclick="adicionar('.')">
                .
            </button>

            <button onclick="voltar()">
                ⌫
            </button>

        </div>

        <a href="../index.html" class="voltar-site">
            ← Voltar para o portfólio
        </a>

    </div>

    <script src="script.js"></script>

</body>

</html>
